name: modern-airbnd

x-api-env: &api-env
  NODE_ENV: production
  PORT: 4000
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
  APP_ORIGIN: ${APP_ORIGIN:?Set HTTPS APP_ORIGIN}
  SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
  ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set ADMIN_PASSWORD_HASH}
  SESSION_MAX_AGE_MS: 28800000
  TRUST_PROXY: 1
  CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
  CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
  CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
  LOG_LEVEL: info

x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    environment: *api-env
    command:
      [
        "node",
        "node_modules/prisma/build/index.js",
        "migrate",
        "deploy",
        "--schema=apps/api/prisma/schema.prisma",
      ]
    restart: "no"
    networks: [app]
    logging: *logging

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    environment: *api-env
    depends_on:
      migrate: {condition: service_completed_successfully}
    ports:
      - "127.0.0.1:4010:4000"
    networks: [app]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${APP_ORIGIN}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_SITE_URL: ${APP_ORIGIN}
    depends_on:
      api: {condition: service_healthy}
    ports:
      - "127.0.0.1:3010:3000"
    networks: [app]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 10s
      retries: 5
    logging: *logging

networks:
  app: {}
