name: modern-airbnd
x-api-env: &api-env
  NODE_ENV: production
  PORT: 4000
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
  APP_ORIGIN: ${APP_ORIGIN:?Set HTTPS APP_ORIGIN}
  SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
  ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set ADMIN_PASSWORD_HASH}
  SESSION_MAX_AGE_MS: 28800000
  TRUST_PROXY: 1
  CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
  CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
  CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
  LOG_LEVEL: info
services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: modern_airbnd
      POSTGRES_USER: modern_airbnd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modern_airbnd -d modern_airbnd"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    environment: *api-env
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy", "--schema=apps/api/prisma/schema.prisma"]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [backend]
    restart: "no"
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    environment: *api-env
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks: [backend, edge]
    expose: ["4000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${APP_ORIGIN}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_SITE_URL: ${APP_ORIGIN}
    depends_on:
      api: {condition: service_healthy}
    networks: [edge]
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 5
    logging: *logging
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: {condition: service_healthy}
    networks: [edge]
    logging: *logging
  backup:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: modern_airbnd
      PGDATABASE: modern_airbnd
      PGPASSWORD: ${POSTGRES_PASSWORD}
    command: ["sh", "/scripts/backup-loop.sh"]
    volumes:
      - ./infra/scripts:/scripts:ro
      - backups:/backups
    depends_on:
      postgres: {condition: service_healthy}
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "test -n "$$(find /backups/daily -name '*.dump' -mmin -1500 -print -quit)""]
      interval: 30m
      timeout: 10s
      retries: 2
      start_period: 2m
    logging: *logging
networks:
  backend: {internal: true}
  edge: {}
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  backups:
