name: Modern Airbnd production deploy

on:
  workflow_run:
    workflows: ["Modern Airbnd quality gate"]
    branches: [main]
    types: [completed]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
    steps:
      - name: Validate required secrets
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_PORT"
          test -n "$VPS_APP_PATH"
          test -n "${{ secrets.VPS_SSH_KEY }}"
          test -n "${{ secrets.VPS_SSH_KNOWN_HOSTS }}"

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.VPS_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy on VPS
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p "$VPS_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "VPS_APP_PATH='$VPS_APP_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$VPS_APP_PATH"

          git fetch origin
          git checkout main
          git reset --hard origin/main

          docker compose -f docker-compose.prod.yml build migrate api web
          docker compose -f docker-compose.prod.yml run --rm migrate
          docker compose -f docker-compose.prod.yml up -d --remove-orphans api web

          curl -fsS http://127.0.0.1:4010/api/v1/health/live >/dev/null
          curl -fsS http://127.0.0.1:4010/api/v1/health/ready >/dev/null
          curl -fsS http://127.0.0.1:3010/ >/dev/null
          REMOTE
