name: Modern Airbnd quality gate
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: modern_airbnd
          POSTGRES_PASSWORD: ci-only-disposable
          POSTGRES_DB: modern_airbnd_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U modern_airbnd -d modern_airbnd_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://modern_airbnd:ci-only-disposable@localhost:5432/modern_airbnd_test
      DATABASE_URL: postgresql://modern_airbnd:ci-only-disposable@localhost:5432/modern_airbnd_test
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            docs/evidence
            playwright-report
            test-results
